<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Animation: two phones send their points. The first proposes 136 → 152 with a streak going from 3 to 4: the rules redo the maths, 136 + 16 = 152, and accept. The second proposes 136 → 999: 136 + 16 is not 999, the rules refuse with permission-denied.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="420" fill="#0C1117"/>
<text x="60" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">THE RULES</text><text x="60" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" text-anchor="start" >The phone proposes, Firestore checks</text><rect x="610" y="100" width="170" height="290" rx="20" fill="#121A21" stroke="#1F2C33"/><text x="695" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="middle" >firestore.rules</text><text x="60" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="start" >An honest phone</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.04;0.06;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.04;0.14;1" values="0 0;0 0;300 0;300 0"/>
  <rect x="60" y="150" width="230" height="84" rx="14" fill="#17222A" stroke="#1F2C33"/>
  <text x="78" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#F1F5F9" text-anchor="start" >points : 136 → 152</text>
  <text x="78" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >streak: 3 → 4</text>
  </g></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.175;0.48;0.505;1" values="0;0;1;1;0;0"/><text x="695" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle" >136 + 16</text><text x="695" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#3DD68C" text-anchor="middle" >= 152 ✓</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.22;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.24;1" values="-20 0;-20 0;0 0;0 0"/>
  <rect x="840" y="150" width="380" height="84" rx="14" fill="#3DD68C" fill-opacity=".1" stroke="#3DD68C" stroke-opacity=".7"/>
  <text x="862" y="184" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#3DD68C" text-anchor="start" >Accepted</text>
  <text x="862" y="210" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >validation and points written together</text>
  </g></g><text x="60" y="268" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="start" >A tampered phone</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.52;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.6;1" values="0 0;0 0;300 0;300 0"/>
  <rect x="60" y="290" width="230" height="84" rx="14" fill="#17222A" stroke="#1F2C33"/>
  <text x="78" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#F1F5F9" text-anchor="start" >points : 136 → 999</text>
  <text x="78" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >streak: 3 → 4</text>
  </g></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.61;0.635;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="695" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle" >136 + 16</text><text x="695" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#FF6B81" text-anchor="middle" >≠ 999 ✗</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.66;0.68;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.66;0.67;0.68;0.69;0.7;1" values="0 0;0 0;-8 0;8 0;-6 0;0 0;0 0"/>
  <rect x="840" y="290" width="380" height="84" rx="14" fill="#FF6B81" fill-opacity=".1" stroke="#FF6B81" stroke-opacity=".7"/>
  <text x="862" y="324" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#FF6B81" text-anchor="start" >Refused</text>
  <text x="862" y="350" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >permission-denied</text>
  </g></g>
</svg>
