<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="Animation: the three BeVannes versions, released on 24 September 2026, fall onto one another, the way they install over each other on the phone. At the bottom, the base never moves: the same signing key, certificate SHA-256 9a8c6764…0f00feeb. 2.0.0 at 11:43: the Flutter rewrite, replacing the FlutterFlow prototype, in demo mode. 2.0.1 at 12:34: the animations, radar, gauge, shine, tick and confetti. 2.1.0 at 17:27, the current version: two apps, the real game wired to Firebase and the demo next to it.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="540" fill="#0C1117"/>
<text x="60" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">THE VERSIONS</text><text x="60" y="66" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" text-anchor="start" >Each one installs over the previous one</text><rect x="60" y="430" width="1160" height="64" rx="14" fill="#0F2B27" stroke="#39D2C0" stroke-opacity=".6"/><g fill="none" stroke="#39D2C0" stroke-width="2" stroke-linecap="round"><circle cx="98" cy="462" r="9"/><path d="M107 462 H130 M122 462 v7 M128 462 v5"/></g><text x="152" y="458" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#A7F3E6" text-anchor="start" >The same signing key</text><text x="152" y="479" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#94A3B0" text-anchor="start" >certificate SHA-256 9a8c6764…0f00feeb, CN=BeVannes</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.06;0.08;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.06;0.11;1" values="0 -60;0 -60;0 0;0 0"/><rect x="60" y="322" width="1160" height="96" rx="16" fill="#121A21" stroke="#1F2C33" stroke-opacity="1"/><text x="86" y="364" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="800" fill="#F1F5F9" text-anchor="start" >2.0.0</text><text x="86" y="394" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >24 Sept · 11:43</text><text x="260" y="364" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" >The rewrite, in demo mode</text><text x="260" y="392" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >Flutter instead of the FlutterFlow prototype, a made-up community, teleporting.</text></g></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.26;0.28;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.26;0.31;1" values="0 -60;0 -60;0 0;0 0"/><rect x="60" y="214" width="1160" height="96" rx="16" fill="#121A21" stroke="#1F2C33" stroke-opacity="1"/><text x="86" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="800" fill="#F1F5F9" text-anchor="start" >2.0.1</text><text x="86" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >24 Sept · 12:34</text><text x="260" y="256" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" >The animations</text><text x="260" y="284" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >Radar, approach gauge, button shine, tick and confetti, screens block by block.</text></g></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.46;0.48;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.46;0.51;1" values="0 -60;0 -60;0 0;0 0"/><rect x="60" y="106" width="1160" height="96" rx="16" fill="#121A21" stroke="#39D2C0" stroke-opacity="0.8"/><text x="86" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="800" fill="#39D2C0" text-anchor="start" >2.1.0</text><text x="86" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >24 Sept · 17:27</text><text x="260" y="148" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" >Two apps</text><text x="260" y="176" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >The real game wired to Firebase, and the demo installed next to it.</text><rect x="1090" y="126" width="106" height="26" rx="13" fill="#0F2B27"/><text x="1143" y="144" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#39D2C0" text-anchor="middle" >current</text></g></g>
