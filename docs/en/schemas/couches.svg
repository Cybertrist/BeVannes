<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Animation: the four BeVannes layers, lib/ui, providers.dart, lib/data and lib/domain, crossed by a tap on “Take the photo”. The token leaves EcranPhoto, goes through positionProvider, asks Localisation.actuelle for a fresh fix, goes down to the domain for distanceMetres, 20 metres out of 100 allowed, back up for recadrerPhoto in 3:4, down again for serieApres and gainPour, streak 4 and +16, and ends in FirebaseDepot.valider, a single transaction. The domain, 5 files and 233 lines of plain Dart, is the layer tested on its own.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="560" fill="#0C1117"/>
