" text-anchor="start" >lib/data</text><text x="508" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="end" >7 files · 820 lines</text><text x="82" y="374" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >Firebase or demo, GPS, photo, reminders</text><rect x="60" y="412" width="470" height="92" rx="16" fill="#0F2B27" stroke="#39D2C0" stroke-opacity="0.6"/><text x="82" y="448" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#A7F3E6" text-anchor="start" >lib/domain</text><text x="508" y="448" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="end" >5 files · 233 lines</text><text x="82" y="478" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >the game rules, in plain Dart, tested</text><circle r="9" fill="url(#degrade)" opacity="0"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.11;0.15;0.21;0.25;0.31;0.35;0.41;0.45;0.51;0.55;0.61;0.65;0.71;1" values="565 146;565 146;565 146;565 250;565 250;565 354;565 354;565 458;565 458;565 354;565 354;565 458;565 458;565 354;565 354;565 354"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.03;0.05;0.8;0.84;1" values="0;0;1;1;0;0"/></circle><text x="600" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">WHAT ONE TAP TOUCHES</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.065;0.95;0.965;1" values=