<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Animation: a wheel scrolls through the places of Vannes, slows down and stops on Hôtel de Limur. At the same moment, three phones belonging to three players show the same spot: each one redoes the draw itself, no server involved.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="380" fill="#0C1117"/>
<text x="70" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">01 · THE DRAW</text><text x="70" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" text-anchor="start" >One seed per day, one shuffle per cycle</text><rect x="70" y="120" width="470" height="174" rx="18" fill="#121A21" stroke="#1F2C33"/><clipPath id="fenetre"><rect x="70" y="120" width="470" height="174" rx="18"/></clipPath><g clip-path="url(#fenetre)"><g>
  <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.06;0.46;0.92;1" keySplines="0 0 1 1;0.15 0.55 0.2 1;0 0 1 1;0 0 1 1" values="0 0;0 0;0 -522;0 -522;0 0"/>
  <text x="305" y="157" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Cathédrale Saint-Pierre</text><text x="305" y="215" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Porte Saint-Vincent</text><text x="305" y="273" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Château de l'Hermine</text><text x="305" y="331" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Lavoirs de la Garenne</text><text x="305" y="389" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Place Henri-IV</text><text x="305" y="447" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >La Cohue</text><text x="305" y="505" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Porte Prison</text><text x="305" y="563" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Place des Lices</text><text x="305" y="621" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Pointe de Conleau</text><text x="305" y="679" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#94A3B0" text-anchor="middle" >Jardin des remparts</text><text x="305" y="737" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F1F5F9" text-anchor="middle" >Hôtel de Limur</text></g></g><rect x="80" y="178" width="450" height="58" rx="12" fill="none" stroke="#39D2C0" stroke-width="2"><animate attributeName="stroke-opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.46;0.49;0.92;0.95;1" values="0.35;0.35;1;1;0.35;0.35"/></rect><rect x="70" y="120" width="470" height="58" fill="#0C1117" opacity=".55"/><rect x="70" y="236" width="470" height="58" fill="#0C1117" opacity=".55"/><text x="70" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#5E6E75" text-anchor="start" >Thursday 24 September, day 20,720</text><text x="700" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">02 · THE SAME EVERYWHERE</text><text x="700" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" text-anchor="start" >Every phone does the maths itself</text><g transform="translate(700 112)"><rect width="150" height="216" rx="24" fill="#121A21" stroke="#1F2C33" stroke-width="2"/><rect x="61" y="8" width="28" height="5" rx="2.5" fill="#1F2C33"/><text x="75" y="44" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="middle" >Maëlle</text><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.525;0.93;0.955;1" values="0;0;1;1;0;0"/><circle cx="75" cy="104" r="26" fill="url(#halo)"/><circle cx="75" cy="104" r="9" fill="url(#degrade)"/><text x="75" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#F1F5F9" text-anchor="middle" >Hôtel de</text><text x="75" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#F1F5F9" text-anchor="middle" >Limur</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.02;0.04;0.5;0.52;1" values="0;0;1;1;0;0"/><text x="75" y="118" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5E6E75" text-anchor="middle" >…</text></g></g><g transform="translate(880 112)"><rect width="150" height="216" rx="24" fill="#121A21" stroke="#1F2C33" stroke-width="2"/><rect x="61" y="8" width="28" height="5" rx="2.5" fill="#1F2C33"/><text x="75" y="44" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="middle" >Yann</text><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.53;0.555;0.93;0.955;1" values="0;0;1;1;0;0"/><circle cx="75" cy="104" r="26" fill="url(#halo)"/><circle cx="75" cy="104" r="9" fill="url(#degrade)"/><text x="75" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#F1F5F9" text-anchor="middle" >Hôtel de</text><text x="75" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#F1F5F9" text-anchor="middle" >Limur</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.02;0.04;0.5;0.52;1" values="0;0;1;1;0;0"/><text x="75" y="118" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5E6E75" text-anchor="middle" >…</text></g></g><g transform="translate(1060 112)"><rect width="150" height="216" rx="24" fill="#121A2