<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="658" viewBox="0 0 1280 658" role="img" aria-label="Animation: the BeVannes stack builds up package by package, from the base to the server. Flutter 3.47 and Dart 3.13 for the whole app. flutter_riverpod 3.4 for state: day, spot, position, distance. go_router 18 for the screens and the signed-out redirect. flutter_map 8.3 and OpenStreetMap for the map, with no API key. geolocator 14 for the position and the mocked-location flag. image_picker and image for the camera and the 3:4 crop. flutter_local_notifications for the reminder, scheduled seven days ahead. firebase_auth for the account, cloud_firestore for players, validations and photos.">
