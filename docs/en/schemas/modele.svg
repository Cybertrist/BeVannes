<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Animation: the BeVannes data model. Authentication keeps the uid, the e-mail and the hashed password. joueurs/{uid}: nickname, points, streak, best streak, validations, last day and creation date. validations/{jour}_{uid}: uid, nickname, day, spot, distance from 0 to 100, gain, streak, photo path and moment. photos/{jour}_{uid}: uid, day and the JPEG as bytes, under 900 KB. Links join the uids and the photo. The {jour}_{uid} id enforces a single validation per player and per day.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="520" fill="#0C1117"/>
<text x="60" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">THE DATA MODEL</text><text x="60" y="66" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" text-anchor="start" >Three Firestore collections, one shared id</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.04;0.065;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="60" y="100" width="262" height="172" rx="16" fill="#121A21" stroke="#1F2C33" stroke-opacity="1"/><text x="78" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >Authentication</text><text x="78" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >the accounts</text><line x1="78" x2="304" y1="166" y2="166" stroke="#1F2C33"/><text x="78" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >uid</text><text x="304" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >string</text><text x="78" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >email</text><text x="304" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >string</text><text x="78" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >password</text><text x="304" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >hashed</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.16;0.185;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="360" y="100" width="262" height="292" rx="16" fill="#121A21" stroke="#39D2C0" stroke-opacity="0.45"/><text x="378" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#39D2C0" text-anchor="start" >joueurs/{uid}</text><text x="378" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >one per player</text><line x1="378" x2="604" y1="166" y2="166" stroke="#1F2C33"/><text x="378" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >pseudo</text><text x="604" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >string</text><text x="378" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >points</text><text x="604" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >int</text><text x="378" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >serie</text><text x="604" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >int</text><text x="378" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >meilleureSerie</text><text x="604" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >int</text><text x="378" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >validations</text><text x="604" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >int</text><text x="378" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >dernierJour</text><text x="604" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >int</text><text x="378" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >creeLe</text><text x="604" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >timestamp</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.28;0.305;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="660" y="100" width="262" height="292" rx="16" fill="#121A21" stroke="#39D2C0" stroke-opacity="0.45"/><text x="678" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#39D2C0" text-anchor="start" >validations/{jour}_{uid}</text><text x="678" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >one per player and day</text><line x1="678" x2="904" y1="166" y2="166" stroke="#1F2C33"/><text x="678" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >uid · pseudo</text><text x="904" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >string</text><text x="678" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >jour</text><text x="904" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >int</text><text x="678" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >lieu</text><text x="904" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >string</text><text x="678" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >distance</text><text x="904" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >0 … 100</text><text x="678" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >gain · serie</text><text x="904" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >int</text><text x="678" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >photo</text><text x="904" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >photos/{id}</text><text x="678" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >moment</text><text x="904" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >timestamp</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.425;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="960" y="100" width="262" height="172" rx="16" fill="#121A21" stroke="#39D2C0" stroke-opacity="0.45"/><text x="978" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#39D2C0" text-anchor="start" >photos/{jour}_{uid}</text><text x="978" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >the validation’s JPEG</text><line x1="978" x2="1204" y1="166" y2="166" stroke="#1F2C33"/><text x="978" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >uid</text><text x="1204" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >string</text><text x="978" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >jour</text><text x="1204" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >int</text><text x="978" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >jpeg</text><text x="1204" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >bytes &lt; 900 KB</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.525;0.95;0.975;1" values="0;0;1;1;0;0"/><path d="M322 191 H341 V191 H360" fill="none" stroke="#39D2C0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="360" cy="191" r="4" fill="#39D2C0"/><text x="341" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#5E6E75" text-anchor="middle" >uid</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.58;0.605;0.95;0.975;1" values="0;0;1;1;0;0"/><path d="M622 191 H641 V191 H660" fill="none" stroke="#39D2C0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="660" cy="191" r="4" fill="#39D2C0"/><text x="641" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#5E6E75" text-anchor="middle" >uid</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.66;0.685;0.95;0.975;1" values="0;0;1;1;0;0"/><path d="M922 341 H941 V191 H960" fill="none" stroke="#39D2C0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="960" cy="191" r="4" fill="#39D2C0"/><text x="941" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#5E6E75" text-anchor="middle" >id</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.74;0.765;0.95;0.975;1" values="0;0;1;1;0;0"/><text x="60" y="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#F1F5F9" text-anchor="start" >The {jour}_{uid} id is the rule: a single validation per player and per day, and its photo carries the same name.</text></g>
