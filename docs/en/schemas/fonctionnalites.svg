<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="The features of BeVannes, in nine cards that light up one after the other. One spot a day, the same for everyone, drawn by each phone. A hundred metres, no more: GPS confirms, a mock location is refused. The photo in 3:4, cropped and slimmed down on the phone. The daily wall, whose photos unlock once yours is posted. Points and streaks: 10 points, +2 per day of streak up to +10. The top hundred leaderboard. The reminder, at a different time every day. The history note of each of the nineteen spots. The demo, with its made-up community and teleporting.">
<defs>
