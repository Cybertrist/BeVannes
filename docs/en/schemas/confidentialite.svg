sans-serif" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >nobody else</text></g><circle r="5" fill="#A7F3E6" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.42;0.43;0.48;0.49;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.42;0.48;1" values="700 320;700 320;780 262;780 262"/></circle><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.47;0.495;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="780" y="228" width="440" height="68" rx="14" fill="#121A21" stroke="#39D2C0" stroke-opacity=".45"/><text x="800" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#39D2C0" text-anchor="start" >joueurs/{uid}</text><text x="800" y="280" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >nickname, points, streak</text><text x="1200" y="280" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >signed-in players</text></g><circle r="5" fill="#A7F3E6" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.54;0.55;0.6;0.61;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.54;0.6;1" values="700 320;700 320;780 346;780 346"/></circle><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.59;0.615;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="780" y="312" width="440" height="68" rx="14" fill="#121A21" stroke="#39D2C0" stroke-opacity=".45"/><text x="800" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#39D2C0" text-anchor="start" >validations/{jour}_{uid}</text><text x="800" y="364" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >spot, distance, time</text><text x="1200" y="364" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >signed-in players</text></g><circle r="5" fill="#A7F3E6" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.66;0.67;0.72;0.73;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.66;0.72;1" values="700 320;700 320;780 430;780 430"/></circle><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.71;0.735;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="780" y="396" width="440" height="68" rx="14" fill="#121A21" stroke="#39D2C0" stroke-opacity=".45"/><text x="800" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#39D2C0" text-anchor="start" >photos/{jour}_{uid}</text><text x="800" y="448" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >the 900 × 1200 JPEG</text><text x="1200" y="448" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >those who validated that day</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.84;0.865;0.95;0.975;1" values="0;0;1;1;0;0"/><text x="60" y="520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#F1F5F9" text-anchor="start" >Deleting your account erases your photos, your validations and your player, then the account itself.</text></g>
</svg>
