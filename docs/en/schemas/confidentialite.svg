l="#94A3B0" text-anchor="start" >only the rounded distance leaves</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.09;0.115;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="60" y="228" width="420" height="68" rx="14" fill="#121A21" stroke="#1F2C33"/><g fill="none" stroke="#39D2C0" stroke-width="2" stroke-linecap="round"><path d="M86 260 v-6 a6 6 0 0 1 12 0 v6"/><rect x="81" y="260" width="22" height="16" rx="4"/></g><circle cx="92" cy="268" r="2" fill="#39D2C0"/><text x="124" y="257" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" >The original photo</text><text x="124" y="280" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >only the 3:4 version is sent</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.14;0.165;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="60" y="312" width="420" height="68" rx="14" fill="#121A21" stroke="#1F2C33"/><g fill="none" stroke="#39D2C0" stroke-width="2" stroke-linecap="round"><path d="M86 344 v-6 a6 6 0 0 1 12 0 v6"/><rect x="81" y="344" width="22" height="16" rx="4"/></g><circle cx="92" cy="352" r="2" fill="#39D2C0"/><text x="124" y="341" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" >The draw of the spot</text><text x="124" y="364" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >computed here, never stored</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.19;0.215;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="60" y="396" 