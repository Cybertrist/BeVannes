<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Animation: in the middle, the phone. On the left, what never leaves it: the exact position, of which only the rounded distance goes out; the original photo, of which only the 3:4 version is sent; the draw of the spot, computed on the phone; the reminder time, a local notification. On the right, four packets leave for Firebase: e-mail and password in Authentication, read by nobody else; nickname, points and streak in joueurs, read by signed-in players; spot, distance and time in validations; the JPEG in photos, readable only by those who validated that day. Deleting your account erases everything.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="560" fill="#0C1117"/>
