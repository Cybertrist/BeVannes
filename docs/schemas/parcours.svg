<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Animation : une validation traverse cinq postes. Le téléphone envoie une photo 3:4 prise à 20 mètres du lieu ; Storage la range dans photos/20720/toi.jpg ; Firestore écrit la validation et met à jour le joueur ; les règles recalculent la série, de 3 à 4, et le gain, 10 + 2 × 3 = 16 ; le classement affiche +16 points et la 4e place. Tout passe, ou rien.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="400" fill="#0C1117"/>
<text x="60" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">UNE VALIDATION</text><text x="60" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" text-anchor="start" >Du déclencheur au classement, en une transaction</text><path d="M262 225 H295" stroke="#1F2C33" stroke-width="3" stroke-linecap="round"/><path d="M262 225 H295" stroke="#39D2C0" stroke-width="3" stroke-linecap="round" stroke-dasharray="45" stroke-dashoffset="45"><animate attributeName="stroke-dashoffset" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.22;0.94;0.97;1" values="45;45;0;0;45;45"/></path><path d="M503 225 H536" stroke="#1F2C33" stroke-width="3" stroke-linecap="round"/><path d="M503 225 H536" stroke="#39D2C0" stroke-width="3" stroke-linecap="round" stroke-dasharray="45" stroke-dashoffset="45"><animate attributeName="stroke-dashoffset" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.26;0.38;0.94;0.97;1" values="45;45;0;0;45;45"/></path><path d="M744 225 H777" stroke="#1F2C33" stroke-width="3" stroke-linecap="round"/><path d="M744 225 H777" stroke="#39D2C0" stroke-width="3" stroke-linecap="round" stroke-dasharray="45" stroke-dashoffset="45"><animate attributeName="stroke-dashoffset" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.42;0.54;0.94;0.97;1" values="45;45;0;0;45;45"/></path><path d="M985 225 H1018" stroke="#1F2C33" stroke-width="3" stroke-linecap="round"/><path d="M985 225 H1018" stroke="#39D2C0" stroke-width="3" stroke-linecap="round" stroke-dasharray="45" stroke-dashoffset="45"><animate attributeName="stroke-dashoffset" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.58;0.7;0.94;0.97;1" values="45;45;0;0;45;45"/></path><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.03;0.055;0.8;0.825;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.06;0.1;0.22;0.26;0.38;0.42;0.54;0.58;0.7;0.74;1" values="158 225;158 225;158 225;399 225;399 225;640 225;640 225;881 225;881 225;1122 225;1122 225;1122 225"/><circle r="22" fill="url(#halo)"/><circle r="8" fill="url(#degrade)" stroke="#0C1117" stroke-width="3"/></g></g><rect x="60" y="150" width="196" height="150" rx="18" fill="#121A21" stroke="#39D2C0" stroke-width="2"><animate attributeName="stroke-opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.06;0.08;0.94;0.97;1" values="0.12;0.12;1;1;0.12;0.12"/></rect><text x="78" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9" text-anchor="start" >Téléphone</text><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.08;0.105;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="78" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >photo 3:4</text></g><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.125;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="78" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >GPS : 20 m du lieu</text></g><rect x="301" y="150" width="196" height="150" rx="18" fill="#121A21" stroke="#39D2C0" stroke-width="2"><animate attributeName="stroke-opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.22;0.24;0.94;0.97;1" values="0.12;0.12;1;1;0.12;0.12"/></rect><text x="319" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9" text-anchor="start" >Storage</text><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.24;0.265;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="319" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >photos/20720/</text></g><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.26;0.285;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="319" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >toi.jpg</text></g><rect x="542" y="150" width="196" height="150" rx="18" fill="#121A21" stroke="#39D2C0" stroke-width="2"><animate attributeName="stroke-opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.38;0.4;0.94;0.97;1" values="0.12;0.12;1;1;0.12;0.12"/></rect><text x="560" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9" text-anchor="start" >Firestore</text><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.425;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="560" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >validation 20720_toi</text></g><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.42;0.445;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="560" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >joueur : série, points</text></g><rect x="783" y="150" width="196" height="150" rx="18" fill="#121A21" stroke="#39D2C0" stroke-width="2"><animate attributeName="stroke-opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.54;0.56;0.94;0.97;1" values="0.12;0.12;1;1;0.12;0.12"/></rect><text x="801" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9" text-anchor="start" >Règles</text><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.56;0.585;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="801" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >série 3 → 4</text></g><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.58;0.605;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="801" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#39D2C0" text-anchor="start" >10 + 2 × 3 = 16 ✓</text></g><rect x="1024" y="150" width="196" height="150" rx="18" fill="#121A21" stroke="#39D2C0" stroke-width="2"><animate attributeName="stroke-opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7;0.72;0.94;0.97;1" values="0.12;0.12;1;1;0.12;0.12"/></rect><text x="1042" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9" text-anchor="start" >Classement</text><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.72;0.745;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="1042" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >+16 points</text></g><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.74;0.765;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="1042" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >4e sur 12</text></g><g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.74;0.765;0.94;0.965;1" values="0;0;1;1;0;0"/><text x="60" y="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#F1F5F9" text-anchor="start" >Tout passe, ou rien : si les règles refusent, la photo et les points restent de côté.</text></g>
</svg>
