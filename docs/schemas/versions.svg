"18" font-weight="700" fill="#F1F5F9" text-anchor="start" >La réécriture, en mode démo</text><text x="260" y="392" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >Flutter à la place du prototype FlutterFlow, une communauté fictive, la téléportation.</text></g></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.26;0.28;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.26;0.31;1" values="0 -60;0 -60;0 0;0 0"/><rect x="60" y="214" width="1160" height="96" rx="16" fill="#121A21" stroke="#1F2C33" stroke-opacity="1"/><text x="86" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="800" fill="#F1F5F9" text-anchor="start" >2.0.1</text><text x="86" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >24 sept. · 12 h 34</text><text x="260" y="256" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" >Les animations</text><text x="260" y="284" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >Radar, jauge d’approche, reflet sur le bouton, coche et confettis, écrans bloc par bloc.</text></g></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.46;0.48;0.94;0.96;1" values="0;0;1;1;0;0"/><g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.46;0.51;1" values="0 -60;0 -60;0 0;0 0"/><rect x="60" y="106" width="1160" height="96" rx="16" fill="#121A21" stroke="#39D2C0" stroke-opacity="0.8"/><text x="86" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="800" fill="#39D2C0" text-anchor="start" >2.1.0</text><text x="86" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="start" >24 sept. · 17 h 27</text><text x="260" y="148" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" >Deux applications</text><text x="260" y="176" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >Le vrai jeu relié à Firebase, et la démo installée à côté, sans se gêner.</text><rect x="1090" y="126" width="106" height="26" rx="13" fill="#0F2B27"/><text x="1143" y="144" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#39D2C0" text-anchor="middle" >en cours</text></g></g>
