<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="Animation : les trois versions de BeVannes, publiées le 24 septembre 2026, tombent l'une sur l'autre, comme elles s'installent par-dessus sur le téléphone. En bas, le socle ne bouge pas : la même clé de signature, certificat SHA-256 9a8c6764…0f00feeb. 2.0.0 à 11 h 43 : la réécriture en Flutter, à la place du prototype FlutterFlow, en mode démo. 2.0.1 à 12 h 34 : les animations, radar, jauge, reflet, coche et confettis. 2.1.0 à 17 h 27, la version en cours : deux applications, le vrai jeu relié à Firebase et la démo à côté.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="540" fill="#0C1117"/>
