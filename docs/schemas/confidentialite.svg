<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Animation : au centre, le téléphone. À gauche, ce qui n'en sort jamais : la position exacte, dont seule la distance arrondie part ; la photo d'origine, dont seule la version 3:4 est envoyée ; le tirage du lieu, calculé sur place ; l'heure du rappel, une notification locale. À droite, quatre paquets partent vers Firebase : l'e-mail et le mot de passe dans Authentication, lus par personne d'autre ; le pseudo, les points et la série dans joueurs, lus par les joueurs connectés ; le lieu, la distance et l'heure dans validations ; le JPEG dans photos, lisible seulement par ceux qui ont validé ce jour-là. Supprimer son compte efface tout.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="560" fill="#0C1117"/>
<text x="60" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">CONFIDENTIALITÉ</text><text x="60" y="66" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" text-anchor="start" >Ce qui reste sur le téléphone, et ce qui en sort</text><ellipse cx="620" cy="290" rx="150" ry="200" fill="url(#halo)" opacity=".45"/><g transform="translate(540 120)"><rect width="160" height="330" rx="25.6" fill="#121A21" stroke="#1F2C33" stroke-width="2"/><rect x="66" y="8" width="28" height="5" rx="2.5" fill="#1F2C33"/><text x="80" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#F1F5F9" text-anchor="middle" >BeVannes</text><circle cx="80" cy="200" r="7" fill="url(#degrade)"/><circle cx="80" cy="200" r="22" fill="none" stroke="#39D2C0" stroke-opacity=".5"/></g><text x="60" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">RESTE ICI</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.04;0.065;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="60" y="144" width="420" height="68" rx="14" fill="#121A21" stroke="#1F2C33"/><g fill="none" stroke="#39D2C0" stroke-width="2" stroke-linecap="round"><path d="M86 176 v-6 a6 6 0 0 1 12 0 v6"/><rect x="81" y="176" width="22" height="16" rx="4"/></g><circle cx="92" cy="184" r="2" fill="#39D2C0"/><text x="124" y="173" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" >La position exacte</text><text x="124" y="196" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >seule la distance arrondie part</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.09;0.115;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="60" y="228" width="420" height="68" rx="14" fill="#121A21" stroke="#1F2C33"/><g fill="none" stroke="#39D2C0" stroke-width="2" stroke-linecap="round"><path d="M86 260 v-6 a6 6 0 0 1 12 0 v6"/><rect x="81" y="260" width="22" height="16" rx="4"/></g><circle cx="92" cy="268" r="2" fill="#39D2C0"/><text x="124" y="257" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" >La photo d’origine</text><text x="124" y="280" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >seule la version 3:4 est envoyée</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.14;0.165;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="60" y="312" width="420" height="68" rx="14" fill="#121A21" stroke="#1F2C33"/><g fill="none" stroke="#39D2C0" stroke-width="2" stroke-linecap="round"><path d="M86 344 v-6 a6 6 0 0 1 12 0 v6"/><rect x="81" y="344" width="22" height="16" rx="4"/></g><circle cx="92" cy="352" r="2" fill="#39D2C0"/><text x="124" y="341" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" >Le tirage du lieu</text><text x="124" y="364" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >calculé ici, jamais stocké</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.19;0.215;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="60" y="396" width="420" height="68" rx="14" fill="#121A21" stroke="#1F2C33"/><g fill="none" stroke="#39D2C0" stroke-width="2" stroke-linecap="round"><path d="M86 428 v-6 a6 6 0 0 1 12 0 v6"/><rect x="81" y="428" width="22" height="16" rx="4"/></g><circle cx="92" cy="436" r="2" fill="#39D2C0"/><text x="124" y="425" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" >L’heure du rappel</text><text x="124" y="448" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B0" text-anchor="start" >notification locale, sans serveur</text></g><text x="780" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">PART VERS FIREBASE</text><circle r="5" fill="#A7F3E6" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.31;0.36;0.37;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.36;1" values="700 320;700 320;780 178;780 178"/></circle><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.375;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="780" y="144" width="440" height="68" rx="14" fill="#121A21" stroke="#39D2C0" stroke-opacity=".45"/><text x="800" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#39D2C0" text-anchor="start" >Authentication</text><text x="800" y="196" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >e-mail et mot de passe</text><text x="1200" y="196" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >personne d’autre</text></g><circle r="5" fill="#A7F3E6" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.42;0.43;0.48;0.49;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.42;0.48;1" values="700 320;700 320;780 262;780 262"/></circle><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.47;0.495;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="780" y="228" width="440" height="68" rx="14" fill="#121A21" stroke="#39D2C0" stroke-opacity=".45"/><text x="800" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#39D2C0" text-anchor="start" >joueurs/{uid}</text><text x="800" y="280" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >pseudo, points, série</text><text x="1200" y="280" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >joueurs connectés</text></g><circle r="5" fill="#A7F3E6" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.54;0.55;0.6;0.61;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.54;0.6;1" values="700 320;700 320;780 346;780 346"/></circle><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.59;0.615;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="780" y="312" width="440" height="68" rx="14" fill="#121A21" stroke="#39D2C0" stroke-opacity=".45"/><text x="800" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#39D2C0" text-anchor="start" >validations/{jour}_{uid}</text><text x="800" y="364" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >lieu, distance, heure</text><text x="1200" y="364" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >joueurs connectés</text></g><circle r="5" fill="#A7F3E6" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.66;0.67;0.72;0.73;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.66;0.72;1" values="700 320;700 320;780 430;780 430"/></circle><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.71;0.735;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="780" y="396" width="440" height="68" rx="14" fill="#121A21" stroke="#39D2C0" stroke-opacity=".45"/><text x="800" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#39D2C0" text-anchor="start" >photos/{jour}_{uid}</text><text x="800" y="448" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >le JPEG 900 × 1200</text><text x="1200" y="448" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B0" text-anchor="end" >ceux qui ont validé ce jour</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.84;0.865;0.95;0.975;1" values="0;0;1;1;0;0"/><text x="60" y="520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#F1F5F9" text-anchor="start" >Supprimer son compte efface ses photos, ses validations et son joueur, puis le compte lui-même.</text></g>
</svg>
