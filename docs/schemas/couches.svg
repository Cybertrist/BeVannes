<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Animation : les quatre couches de BeVannes, lib/ui, providers.dart, lib/data et lib/domain, traversées par un appui sur « Prendre la photo ». Le jeton part de EcranPhoto, passe par positionProvider, demande une mesure fraîche à Localisation.actuelle, descend au domaine pour distanceMetres, 20 mètres sur 100 permis, remonte pour recadrerPhoto en 3:4, redescend pour serieApres et gainPour, série 4 et +16, et finit dans FirebaseDepot.valider, une seule transaction. Le domaine, 5 fichiers et 233 lignes de Dart pur, est la couche testée à part.">
<defs>
  <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#39D2C0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#39D2C0" stop-opacity=".35"/><stop offset="1" stop-color="#39D2C0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="560" fill="#0C1117"/>
<text x="60" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">ARCHITECTURE</text><text x="60" y="66" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" text-anchor="start" >Quatre couches, traversées par une validation</text><rect x="60" y="100" width="470" height="92" rx="16" fill="#121A21" stroke="#1F2C33" stroke-opacity="1"/><text x="82" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="start" >lib/ui</text><text x="508" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="end" >9 fichiers · 3 586 lignes</text><text x="82" y="166" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >les écrans et leurs animations</text><rect x="60" y="204" width="470" height="92" rx="16" fill="#121A21" stroke="#1F2C33" stroke-opacity="1"/><text x="82" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="start" >lib/providers.dart</text><text x="508" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="end" >1 fichier · 125 lignes</text><text x="82" y="270" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >l’état partagé, par Riverpod</text><rect x="60" y="308" width="470" height="92" rx="16" fill="#121A21" stroke="#1F2C33" stroke-opacity="1"/><text x="82" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="start" >lib/data</text><text x="508" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="end" >7 fichiers · 820 lignes</text><text x="82" y="374" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >Firebase ou démo, GPS, photo, rappels</text><rect x="60" y="412" width="470" height="92" rx="16" fill="#0F2B27" stroke="#39D2C0" stroke-opacity="0.6"/><text x="82" y="448" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#A7F3E6" text-anchor="start" >lib/domain</text><text x="508" y="448" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#5E6E75" text-anchor="end" >5 fichiers · 233 lignes</text><text x="82" y="478" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="start" >les règles du jeu, en Dart pur, testées</text><circle r="9" fill="url(#degrade)" opacity="0"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.11;0.15;0.21;0.25;0.31;0.35;0.41;0.45;0.51;0.55;0.61;0.65;0.71;1" values="565 146;565 146;565 146;565 250;565 250;565 354;565 354;565 458;565 458;565 354;565 354;565 458;565 458;565 354;565 354;565 354"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.03;0.05;0.8;0.84;1" values="0;0;1;1;0;0"/></circle><text x="600" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#5E6E75" text-anchor="start" letter-spacing="1.5">CE QUE TOUCHE UN APPUI</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.065;0.95;0.965;1" values="0;0;1;1;0;0"/><rect x="600" y="124" width="620" height="44" rx="11" fill="#121A21" stroke="#1F2C33"/><text x="618" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >EcranPhoto</text><text x="1202" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#39D2C0" text-anchor="end" >« Prendre la photo »</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.165;0.95;0.965;1" values="0;0;1;1;0;0"/><rect x="600" y="180" width="620" height="44" rx="11" fill="#121A21" stroke="#1F2C33"/><text x="618" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >positionProvider</text><text x="1202" y="208" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#39D2C0" text-anchor="end" >la position suivie</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.265;0.95;0.965;1" values="0;0;1;1;0;0"/><rect x="600" y="236" width="620" height="44" rx="11" fill="#121A21" stroke="#1F2C33"/><text x="618" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >Localisation.actuelle()</text><text x="1202" y="264" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#39D2C0" text-anchor="end" >une mesure fraîche</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.365;0.95;0.965;1" values="0;0;1;1;0;0"/><rect x="600" y="292" width="620" height="44" rx="11" fill="#121A21" stroke="#1F2C33"/><text x="618" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >distanceMetres()</text><text x="1202" y="320" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#39D2C0" text-anchor="end" >20 m ≤ 100 m</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.465;0.95;0.965;1" values="0;0;1;1;0;0"/><rect x="600" y="348" width="620" height="44" rx="11" fill="#121A21" stroke="#1F2C33"/><text x="618" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >recadrerPhoto()</text><text x="1202" y="376" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#39D2C0" text-anchor="end" >3:4, 900 × 1200</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.565;0.95;0.965;1" values="0;0;1;1;0;0"/><rect x="600" y="404" width="620" height="44" rx="11" fill="#121A21" stroke="#1F2C33"/><text x="618" y="432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >serieApres() · gainPour()</text><text x="1202" y="432" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#39D2C0" text-anchor="end" >série 4, +16</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.65;0.665;0.95;0.965;1" values="0;0;1;1;0;0"/><rect x="600" y="460" width="620" height="44" rx="11" fill="#121A21" stroke="#1F2C33"/><text x="618" y="488" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >FirebaseDepot.valider()</text><text x="1202" y="488" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#39D2C0" text-anchor="end" >une seule transaction</text></g>
</svg>
