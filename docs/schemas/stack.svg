<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="658" viewBox="0 0 1280 658" role="img" aria-label="Animation : la stack de BeVannes se monte paquet par paquet, du socle au serveur. Flutter 3.47 et Dart 3.13 pour toute l'application. flutter_riverpod 3.4 pour l'état : jour, lieu, position, distance. go_router 18 pour les écrans et la redirection sans compte. flutter_map 8.3 et OpenStreetMap pour la carte, sans clé d'API. geolocator 14 pour la position et le drapeau de position fictive. image_picker et image pour l'appareil photo et le recadrage 3:4. flutter_local_notifications pour le rappel, programmé sept jours d'avance. firebase_auth pour le compte, cloud_firestore pour les joueurs, les validations et les photos.">
