name: bevannes
description: "BeVannes, un lieu de Vannes par jour, validé par GPS et par une photo."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.3
  go_router: ^18.0.1
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/lieux.json
    - assets/img/logo.png

  # Polices embarquées : aucune requête vers Google Fonts.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800

# L'icône : le V pris à l'intérieur du badge du logo, plein cadre. Pas
# d'icône adaptative : le système arrondit, et aucun bord du badge ne peut
# réapparaître dans les coins.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  min_sdk_android: 21

# L'écran d'ouverture natif : le logo complet, sur la couleur de son fond.
flutter_native_splash:
  color: '#011C18'
  image: assets/icon/splash.png
  android_12:
    color: '#011C18'
    image: assets/icon/splash.png
  ios: false
  web: false
